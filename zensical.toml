[project]
site_url = "https://jetsung.github.io/relaydrop/"
site_name = "RelayDrop"
site_description = "Minimal file relay over WebSocket/TLS relay transport"
site_author = "jetsung"

copyright = "Copyright &copy; 2026 jetsung"

repo_url = "https://github.com/jetsung/relaydrop"
repo_name = "jetsung/relaydrop"
edit_uri = "edit/main/docs/"

nav = [
  { "首页" = "index.md" },
  { "使用指南" = [
    { "安装与部署中继" = "install.md" },
    { "客户端用法" = "usage.md" },
    { "环境变量" = "env.md" },
    { "Docker 部署" = "docker.md" },
  ]},
  { "部署方式" = [
    { "nginx 反向代理" = "nginx.md" },
    { "Cloudflare 侧配置" = "cloudflare.md" },
    { "cloudflared 隧道" = "cloudflared.md" },
  ]},
  { "参考" = [
    { "安全说明" = "security.md" },
    { "线协议与加密" = "protocol.md" },
  ]},
]

[project.theme]
language = "zh"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Noto Sans SC"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换亮色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "切换到暗色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统偏好"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jetsung/relaydrop"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
