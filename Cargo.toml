[package]
name = "relaydrop"
version = "0.1.3"
edition = "2024"
description = "Minimal file relay over WebSocket/TLS relay transport"
license = "Apache-2.0"

[[bin]]
name = "relaydrop"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# rustls 0.23 no longer auto-selects a crypto provider; enable one explicitly.
# default-features = false drops the `aws-lc-rs` default so only `ring` is
# compiled in (avoids the "exactly one provider" ambiguity) and the code
# installs it via CryptoProvider::install_default() at startup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.10"
anyhow = "1"
hex = "0.4"
base64 = "0.22"

[package.metadata.deb]
maintainer = "Jetsung Chan <i@jetsung.com>"
assets = [
    # [源路径, 目标路径, 权限]
    ["target/release/relaydrop", "usr/bin/relaydrop", "755"],
    # 如果有配置文件，可以这样加：
    # ["assets/config.toml", "etc/my-tool/config.toml", "644"],
]

[package.metadata.generate-rpm]
maintainer = "Jetsung Chan <i@jetsung.com>"
assets = [
    # [源路径, 目标路径, 权限]
    { source = "target/release/relaydrop", dest = "/usr/bin/relaydrop", mode = "755" }#
]
