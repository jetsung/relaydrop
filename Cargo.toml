[package]
name = "relaydrop"
version = "0.1.0"
edition = "2024"
description = "Minimal file relay over WebSocket/TLS relay transport"
license = "MIT"

[[bin]]
name = "relaydrop"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.10"
anyhow = "1"
hex = "0.4"
base64 = "0.22"
